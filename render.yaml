services:
  # 1. Unified Web Console (FastAPI + AG Grid + Google ADK Agent)
  - type: web
    name: paypal-agent-shield-web
    runtime: python
    region: oregon
    plan: starter
    buildCommand: uv sync && (npm --prefix frontend ci && npm --prefix frontend run build || true)
    startCommand: uv run uvicorn shield_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UV_VERSION
        value: 0.13.5
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RENDER_WORKFLOW_SLUG
        fromService:
          type: workflow
          name: paypal-shield-workflow
          property: slug
      - key: GOOGLE_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false

  # 2. Distributed Render Workflows Engine (Official Hackathon Requirement)
  - type: workflow
    name: paypal-shield-workflow
    runtime: python
    region: oregon
    repo: https://github.com/janfaiengineer/paypal-agent-shield
    branch: main
    buildCommand: uv sync
    startCommand: uv run python shield_workflows.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UV_VERSION
        value: 0.13.5
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
